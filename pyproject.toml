[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-solax"
version = "0.1.0"
description = "Home Assistant custom integration for SolaX inverters via local HTTP API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Darryl Cauldwell"},
]
dependencies = [
    "aiosolax==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
